<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرت ویژن | درحال بارگذاری</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bodyLoad">
    <!-- افکت زمینه -->
    <div class="art-bg">
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
    </div>


        <!-- لوئر -->
        <div class="loader">
            <div class="loader-circle"></div>
            <div class="loader-circle"></div>
            <div class="loader-circle"></div>
        </div>
        
        <!-- نوار پیشرفت -->
        <div class="progress-container">
            <div class="progress-text">در حال بارگذاری گالری</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="percentage" id="percentage">0%</div>
        </div>
        
        <!-- پیام -->
        <div class="message">
            لطفاً کمی صبر کنید...
            <br>
            زیبایی‌ها در حال نمایش هستند
        </div>
    </div>

    <script>
 // منتظر بمان تا همه المان‌های DOM لود شوند
        document.addEventListener('DOMContentLoaded', function() {
            console.log('صفحه لود شد، شروع بارگذاری...');
            
            // شبیه‌سازی پیشرفت بارگذاری
            let progress = 0;
            const progressFill = document.getElementById('progressFill');
            const percentage = document.getElementById('percentage');
            
            const progressInterval = setInterval(() => {
                progress += Math.random() * 3 + 1; // پیشرفت تصادفی بین ۱ تا ۴ درصد
                
                // محدود کردن به ۱۰۰%
                if (progress > 100) {
                    progress = 100;
                }
                
                // به‌روزرسانی نوار پیشرفت
                progressFill.style.width = `${progress}%`;
                percentage.textContent = `${Math.round(progress)}%`;
                
                // اگر به ۱۰۰% رسیدیم
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    
                    // کمی تاخیر قبل از انتقال
                    setTimeout(() => {
                        // افکت محو شدن
                        document.body.style.opacity = '0';
                        
                        // انتقال به صفحه اصلی بعد از کامل شدن افکت
                        setTimeout(() => {
                            window.location.href = "index.html"; // تغییر به آدرس صفحه اصلی
                        }, 800);
                    }, 500);
                }
                
            }, 300);
            
            // پیام در کنسول
            console.log('گالری هنری در حال بارگذاری...');
        });
</script>
</body>
</html>
