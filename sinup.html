<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود کاربر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ذرات شناور -->
    <div class="floating-particles" id="particles"></div>

    <!-- آواتارهای شناور -->
    <div class="floating-avatars">
        <div class="avatar" style="top: 10%; left: 5%; animation-delay: 0s;"><i class="fas fa-user"></i></div>
        <div class="avatar" style="top: 20%; right: 10%; animation-delay: 2s;"><i class="fas fa-user-tie"></i></div>
        <div class="avatar" style="bottom: 30%; left: 15%; animation-delay: 4s;"><i class="fas fa-user-graduate"></i></div>
        <div class="avatar" style="bottom: 20%; right: 5%; animation-delay: 6s;"><i class="fas fa-user-astronaut"></i></div>
    </div>

    <!-- کانتینر اصلی ورود -->
    <main class="login-container">
        <div class="login-card">
            <div class="login-card-header">
                <div class="login-icon">
                    <i class="fas fa-user-lock"></i>
                </div>
                <h1>ورود به حساب کاربری</h1>
                <p>لطفاً اطلاعات حساب خود را وارد کنید</p>
            </div>
            
            <div class="login-card-body">
                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="username">نام کاربری یا ایمیل</label>
                        <div class="input-with-icon">
                            <input type="text" id="username" class="form-control" placeholder="نام کاربری یا ایمیل خود را وارد کنید" required>
                            <div class="input-icon">
                                <i class="fas fa-user"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">رمز عبور</label>
                        <div class="input-with-icon">
                            <input type="password" id="password" class="form-control" placeholder="رمز عبور خود را وارد کنید" required>
                            <div class="input-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">مرا به خاطر بسپار</label>
                    </div>

                    <a href="dashboard.html" style="text-decoration: none"><button type="submit" class="submit-btn">
                     
                        ورود به حساب
                    </button></a>



                    <div class="login-footer">
                        <p>حساب کاربری ندارید؟ <a href="register.html" id="signupLink">همین حالا ثبت نام کنید</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>
     
    <script src="js/script.js"></script>
</body>
</html>
